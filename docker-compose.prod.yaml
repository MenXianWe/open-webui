name: qlcode-chat

services:
  qlcode-chat:
    image: qlcode-chat:${QLCODE_CHAT_DOCKER_TAG:-v0.9.5}
    container_name: qlcode-chat
    volumes:
      - qlcode-chat:/app/backend/data
    ports:
      - ${QLCODE_CHAT_PORT:-3000}:8080
    environment:
      - WEBUI_SECRET_KEY=${QLCODE_CHAT_SECRET_KEY:?set QLCODE_CHAT_SECRET_KEY in .env}
      - CORS_ALLOW_ORIGIN=${CORS_ALLOW_ORIGIN:-https://qlcodeapi.com}
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-*}
      - SCARF_NO_ANALYTICS=${SCARF_NO_ANALYTICS:-true}
      - DO_NOT_TRACK=${DO_NOT_TRACK:-true}
      - ANONYMIZED_TELEMETRY=${ANONYMIZED_TELEMETRY:-false}
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  qlcode-chat: {}
